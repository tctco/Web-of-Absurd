<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4f9b" />
    <meta name="description" content="Web of Absurd - 仿 Web of Science 的抽象期刊目录" />
    <title>Web of Absurd</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <header class="topbar">
      <div class="brand">
        <img src="./logo.png" alt="Web of Absurd" class="brand-logo" />
        <div>
          <h1>Web of Absurd</h1>
        </div>
      </div>
      <div class="seed-box">
        <span>GMT Seed</span>
        <strong id="seedDate">-</strong>
      </div>
    </header>

    <main class="layout">
      <section class="panel view-tabs" id="viewTabs">
        <button class="view-tab active" type="button" data-view="catalog">目录</button>
        <button class="view-tab" type="button" data-view="metrics">Metrics</button>
      </section>

      <div id="catalogView">
        <section class="panel filters">
          <div class="section-tabs" id="sectionTabs">
            <button class="section-tab active" type="button" data-section="SCIE">SCIE</button>
            <button class="section-tab" type="button" data-section="北小核心">北小核心</button>
            <button class="section-tab" type="button" data-section="会议">会议</button>
          </div>

          <div class="search-row">
            <label for="searchInput">检索期刊</label>
            <input id="searchInput" type="search" placeholder="输入期刊名、主编、学科标签、注释..." />
          </div>
          <div class="filter-grid">
            <label>
              分区
              <select id="tierFilter">
                <option value="ALL">全部</option>
                <option value="T1">T1</option>
                <option value="T2">T2</option>
                <option value="T3">T3</option>
                <option value="T4">T4</option>
              </select>
            </label>
            <label>
              综述期刊
              <select id="reviewFilter">
                <option value="ALL">全部</option>
                <option value="ONLY">仅综述</option>
              </select>
            </label>
            <label>
              状态
              <select id="holdFilter">
                <option value="ALL">全部</option>
                <option value="ONLY">仅 On Hold</option>
                <option value="EXCLUDE">排除 On Hold</option>
              </select>
            </label>
            <label>
              来源
              <select id="sourceFilter">
                <option value="ALL">全部</option>
                <option value="XHS">XHS</option>
                <option value="CAS_WARNING">中科院预警</option>
                <option value="WOS_DELISTED">WOS除名</option>
              </select>
            </label>
            <div class="tag-tree-filter">
              <div class="tag-tree-head">
                <span>学科标签（树）</span>
                <button id="clearTagTree" type="button">清除</button>
              </div>
              <p class="tag-tree-selected">
                当前：<strong id="tagTreeSelected">全部</strong>
              </p>
              <div id="tagTree" class="tag-tree"></div>
            </div>
          </div>
        </section>

        <section class="stats">
          <article class="panel stat">
            <span>期刊总数</span>
            <strong id="totalCount">-</strong>
          </article>
          <article class="panel stat">
            <span>当前结果</span>
            <strong id="visibleCount">-</strong>
          </article>
        </section>

        <section class="panel results-panel">
          <div class="table-wrap">
            <table id="desktopTable">
              <thead>
                <tr>
                  <th>封面</th>
                  <th>
                    <button id="titleSortBtn" type="button" class="sort-btn">
                      期刊 <span id="titleSortIndicator">↕</span>
                    </button>
                  </th>
                  <th>分区</th>
                  <th>
                    <button id="aifSortBtn" type="button" class="sort-btn">
                      AIF <span id="aifSortIndicator">↕</span>
                    </button>
                  </th>
                  <th>收录</th>
                  <th>主编/编辑部</th>
                  <th>学科标签</th>
                  <th>综述</th>
                  <th>状态</th>
                  <th>注释</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <div class="mobile-list" id="mobileList"></div>

          <div class="pagination">
            <div class="pagination-size">
              <label>
                每页数量
                <select id="pageSize">
                  <option value="8">8</option>
                  <option value="10" selected>10</option>
                  <option value="20">20</option>
                  <option value="50">50</option>
                </select>
              </label>
            </div>
            <div class="pagination-nav">
              <button id="prevPage" type="button">上一页</button>
              <span id="pageInfo">第 1 / 1 页</span>
              <button id="nextPage" type="button">下一页</button>
            </div>
          </div>
        </section>
      </div>

      <section class="metrics-view hidden" id="metricsView">
        <article class="panel metric-panel">
          <h3>Journal Count Trend</h3>
          <div id="metricLineChart" class="metric-chart"></div>
        </article>
        <article class="panel metric-panel">
          <h3>Title Word Cloud</h3>
          <div id="metricWordCloud" class="metric-chart"></div>
        </article>
        <article class="panel metric-panel">
          <h3>Journal Type Pie</h3>
          <div id="metricTypePie" class="metric-chart"></div>
        </article>
        <article class="panel metric-panel">
          <h3>Subject Tag Pie</h3>
          <div class="metric-scope-tabs" id="metricTagScopeTabs">
            <button type="button" class="metric-scope-tab active" data-metric-scope="ALL">总体</button>
            <button type="button" class="metric-scope-tab" data-metric-scope="SCIE">SCIE</button>
            <button type="button" class="metric-scope-tab" data-metric-scope="北小核心">北小核心</button>
            <button type="button" class="metric-scope-tab" data-metric-scope="会议">会议</button>
          </div>
          <div id="metricTagPie" class="metric-chart"></div>
        </article>
      </section>
    </main>

    <template id="emptyStateTpl">
      <div class="empty-state">没有匹配结果，请调整检索条件。</div>
    </template>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span class="footer-label">友情链接</span>
        <nav class="footer-links" aria-label="友情链接">
          <a href="http://47.100.93.220:5000" target="_blank" rel="noopener noreferrer">Gaggle Scholar</a>
          <a href="https://webofnothing.org" target="_blank" rel="noopener noreferrer">Web of Nothing</a>
          <a href="http://121.41.230.120:3000/" target="_blank" rel="noopener noreferrer">OpenJunk</a>
        </nav>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2/dist/echarts-wordcloud.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
